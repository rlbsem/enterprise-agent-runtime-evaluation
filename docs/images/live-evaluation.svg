<style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#F0F0FF}.small{font-size:16px}.label{font-size:20px}.value{font-size:27px;font-weight:bold}.blocked{fill:#D98EA3}</style>
<text x="36" y="42" class="small">LOCAL MODEL EVALUATION / RELEASE EVIDENCE</text>
